# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK — local EAS build on GitHub Actions
#
# Required GitHub Secrets:
#   EXPO_TOKEN               — from https://expo.dev/accounts/<user>/settings/access-tokens
#   ANDROID_KEYSTORE_BASE64  — base64-encoded keystore file (see scripts/gen-keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# ─────────────────────────────────────────────────────────────────────────────

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Что нового в этой версии (необязательно)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Java / Android SDK / NDK ───────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.1
        # react-native-webrtc and other native modules require NDK 27.1
        run: sdkmanager --install "ndk;27.1.12297006"

      # ── EAS CLI ────────────────────────────────────────────────────────────
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Android keystore ───────────────────────────────────────────────────
      - name: Prepare keystore & credentials.json
        working-directory: artifacts/messenger-android
        env:
          KS_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:    ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:  ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 --decode > keystore.jks
          # credentials.json is read by EAS CLI when credentialsSource = "local"
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "keystore.jks",
                "keystorePassword": "$KS_PASS",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASS"
              }
            }
          }
          EOF

      # ── Build ──────────────────────────────────────────────────────────────
      # GOOGLE_SERVICES_JSON is read by app.config.js at Expo config-eval time,
      # which runs inside the EAS sandbox after the project archive is extracted.
      # Writing the file there (not via git) is the only reliable approach for
      # EAS local builds — git archive only captures committed files, and the
      # secret cannot be committed to the repo.
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build APK (EAS local)
        working-directory: artifacts/messenger-android
        env:
          NODE_ENV: production
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/messenger-family.apk"

      # ── version.json for the In-App Updater ───────────────────────────────
      # После сборки выложить оба файла на VPS:
      #   scp messenger-family.apk version.json vps:/opt/messenger/updates/
      #   (переименовав APK в messenger.apk)
      - name: Generate version.json
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node -e "
            const app = require('./artifacts/messenger-android/app.json');
            const info = {
              versionCode: app.expo.android.versionCode,
              versionName: app.expo.version,
              releasedAt: process.env.BUILD_DATE,
              changelog: process.env.RELEASE_NOTES || '',
              apkUrl: 'messenger.apk',
            };
            require('fs').writeFileSync('version.json', JSON.stringify(info, null, 2));
            console.log(JSON.stringify(info, null, 2));
          "

      # ── Artifact ───────────────────────────────────────────────────────────
      - name: Upload APK + version.json
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android-v${{ github.run_number }}
          path: |
            messenger-family.apk
            version.json
          retention-days: 30
