# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK — expo prebuild + Gradle (no EAS cloud)
#
# Why not `eas build --local`?
#   In a pnpm monorepo, EAS CLI calls `expo config --json` and expo CLI
#   traverses up from the CWD, hits the root package.json of the monorepo
#   instead of artifacts/messenger-android/package.json, and exits with
#   code 1 — no output, no diagnosis. Using `expo prebuild` + direct Gradle
#   bypasses that entirely.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64  — base64-encoded keystore file (see scripts/gen-keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON     — content of google-services.json (single-line or pretty)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Что нового в этой версии (необязательно)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Java / Android SDK / NDK ───────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.1
        # react-native-webrtc and other native modules require NDK 27.1
        run: sdkmanager --install "ndk;27.1.12297006"

      # ── Build date ─────────────────────────────────────────────────────────
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # ── Expo prebuild ──────────────────────────────────────────────────────
      # Generates android/ native directory from Expo config plugins.
      # Runs entirely locally — no Expo account or EXPO_TOKEN required.
      # GOOGLE_SERVICES_JSON is written to google-services.json by app.config.js.
      - name: Run expo prebuild
        working-directory: artifacts/messenger-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean

      # ── Post-prebuild manifest fixes ──────────────────────────────────────
      # Patches applied to the generated AndroidManifest.xml that cannot be
      # done reliably in config plugins due to plugin execution-order races
      # (some Expo package plugins add their meta-data AFTER our plugin runs).
      - name: Fix manifest merger conflicts
        working-directory: artifacts/messenger-android
        run: |
          python3 - << 'PYEOF'
          import sys

          path = 'android/app/src/main/AndroidManifest.xml'
          txt = open(path).read()

          # react-native-firebase_messaging ships its own AndroidManifest that
          # declares default_notification_color=@color/white. Our app-level manifest
          # declares it as @color/notification_icon_color. Android manifest merger
          # rejects the duplicate unless the higher-priority (app) entry carries
          # tools:replace="android:resource". xmlns:tools is already on <manifest>.
          OLD = (
              'android:name="com.google.firebase.messaging.default_notification_color"'
              ' android:resource="@color/notification_icon_color"/>'
          )
          NEW = (
              'android:name="com.google.firebase.messaging.default_notification_color"'
              ' android:resource="@color/notification_icon_color"'
              ' tools:replace="android:resource"/>'
          )

          if OLD in txt:
              txt = txt.replace(OLD, NEW, 1)
              open(path, 'w').write(txt)
              print('manifest: added tools:replace to default_notification_color')
          else:
              # Print current notification_color lines to aid debugging
              for i, line in enumerate(txt.splitlines(), 1):
                  if 'notification_color' in line:
                      print(f'  line {i}: {line.strip()}', file=sys.stderr)
              print('WARNING: expected meta-data line not found — check manifest format', file=sys.stderr)
          PYEOF

      # ── Release signing ────────────────────────────────────────────────────
      # Decodes the keystore, then patches the generated build.gradle to add a
      # proper release signingConfig that reads from env vars at build time.
      # Secrets are never written to disk — they are passed only as env vars
      # to the Gradle process.
      - name: Configure release signing
        working-directory: artifacts/messenger-android
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_BASE64" | base64 --decode > keystore.jks

          python3 - << 'PYEOF'
          import re, sys

          path = 'android/app/build.gradle'
          txt = open(path).read()

          # 1. Insert release signingConfig block after the debug block.
          #    We look for the exact end of the debug signing block.
          release_block = """\n        release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: "debug.keystore")
                      storePassword System.getenv("KS_PASS") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASS") ?: ""
                  }"""

          debug_end = "keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }"
          if debug_end in txt:
              txt = txt.replace(debug_end, debug_end + release_block, 1)
              print("Inserted release signingConfig block")
          else:
              print("WARNING: debug signingConfig end-marker not found — check build.gradle format", file=sys.stderr)

          # 2. Change the release buildType to use signingConfigs.release
          #    (replace the LAST occurrence of signingConfig signingConfigs.debug,
          #    which is the one inside the release { } buildType block).
          marker = 'signingConfig signingConfigs.debug'
          last = txt.rfind(marker)
          if last != -1:
              txt = txt[:last] + txt[last:].replace(marker, 'signingConfig signingConfigs.release', 1)
              print("Wired release buildType to signingConfigs.release")
          else:
              print("WARNING: release signingConfig assignment not found", file=sys.stderr)

          # 3. Add firebase-messaging as a direct app-module dependency so our
          #    custom CallFirebaseMessagingService.java can resolve
          #    FirebaseMessagingService and RemoteMessage at compile time.
          #    @react-native-firebase/messaging declares it as 'implementation'
          #    (not 'api'), so it is NOT transitively visible to the app module.
          #    Gradle resolves the version via the firebase BOM already in the graph.
          dep = "    implementation 'com.google.firebase:firebase-messaging'"
          if dep not in txt:
              # Inject right after the opening of the dependencies { block.
              txt = txt.replace(
                  'dependencies {',
                  'dependencies {\n' + dep,
                  1,
              )
              print("Added com.google.firebase:firebase-messaging dependency")
          else:
              print("firebase-messaging dependency already present")

          open(path, 'w').write(txt)
          print("build.gradle patched for release signing")
          PYEOF

      # ── Build APK ──────────────────────────────────────────────────────────
      - name: Build APK (Gradle)
        working-directory: artifacts/messenger-android/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/artifacts/messenger-android/keystore.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             "${{ github.workspace }}/messenger-family.apk"

      # ── version.json for the In-App Updater ───────────────────────────────
      # После сборки выложить оба файла на VPS:
      #   scp messenger-family.apk vps:~/docker_containers/messenger/updates/messenger.apk
      #   scp version.json vps:~/docker_containers/messenger/updates/
      - name: Generate version.json
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
        run: |
          node -e "
            const app = require('./artifacts/messenger-android/app.json');
            const info = {
              versionCode: app.expo.android.versionCode,
              versionName: app.expo.version,
              releasedAt: process.env.BUILD_DATE,
              changelog: process.env.RELEASE_NOTES || '',
              apkUrl: 'messenger.apk',
            };
            require('fs').writeFileSync('version.json', JSON.stringify(info, null, 2));
            console.log(JSON.stringify(info, null, 2));
          "

      # ── Artifact ───────────────────────────────────────────────────────────
      - name: Upload APK + version.json
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android-v${{ github.run_number }}
          path: |
            messenger-family.apk
            version.json
          retention-days: 30
