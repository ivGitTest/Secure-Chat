# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK — expo prebuild + Gradle (no EAS cloud)
#
# version.json генерируется из полей ниже и сохраняется в артефакт вместе
# с APK. apkUrl и releasedAt подставляются автоматически.
#
# Why not `eas build --local`?
#   In a pnpm monorepo, EAS CLI calls `expo config --json` and expo CLI
#   traverses up from the CWD, hits the root package.json of the monorepo
#   instead of artifacts/messenger-android/package.json, and exits with
#   code 1 — no output, no diagnosis. Using `expo prebuild` + direct Gradle
#   bypasses that entirely.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64  — base64-encoded keystore file (see scripts/gen-keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON     — content of google-services.json (single-line or pretty)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия (versionName), например 2.0.6'
        required: true
        type: string
      changelog:
        description: 'Что нового (changelog)'
        required: true
        type: string

concurrency:
  # Не запускаем две ручные сборки одной ветки одновременно: обе могут
  # вычислить одинаковый versionCode и одновременно обновлять version.json.
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Проверяем текущую версию ────────────────────────────────────────────
      - name: Show current version.json
        run: |
          if [ ! -f artifacts/messenger-android/version.json ]; then
            echo "ℹ️ version.json не найден — текущие значения отсутствуют"
            exit 0
          fi

          node - <<'NODE'
          const fs = require('fs');
          let info;
          try {
            info = JSON.parse(fs.readFileSync('artifacts/messenger-android/version.json', 'utf8'));
          } catch (error) {
            console.error('❌ Не удалось прочитать version.json:', error.message);
            process.exit(1);
          }
          console.log('📋 Текущие значения из version.json:');
          console.log('   versionName: ' + (info.versionName ?? 'не указано'));
          console.log('   versionCode: ' + (info.versionCode ?? 'не указано'));
          console.log('   changelog:  ' + (info.changelog ?? 'не указано'));
          console.log('   releasedAt: ' + (info.releasedAt ?? 'не указано'));
          console.log('   apkUrl:     ' + (info.apkUrl ?? 'не указано'));
          NODE

      # ── Резервируем versionCode до начала сборки ────────────────────────────
      # Версия должна быть отправлена в main ДО Gradle-сборки. Иначе за время
      # сборки другой commit может изменить version.json, а post-build rebase
      # закончится конфликтом и APK останется без артефакта.
      #
      # При гонке push повторяется с новым origin/main: reset берёт актуальный
      # version.json, после чего номер увеличивается ещё на единицу. Поэтому
      # versionCode APK всегда совпадает с сохранённым в репозитории.
      - name: Reserve and commit version.json
        id: generate-version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_CHANGELOG:    ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          version_path="artifacts/messenger-android/version.json"

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "${branch}"
            git reset --hard "origin/${branch}"

            node <<'NODE'
          const fs = require('fs');
          const versionPath = 'artifacts/messenger-android/version.json';
          let currentCode = 0;
          if (fs.existsSync(versionPath)) {
            let current;
            try {
              current = JSON.parse(fs.readFileSync(versionPath, 'utf8'));
            } catch (error) {
              throw new Error('Не удалось прочитать version.json: ' + error.message);
            }
            currentCode = Number(current.versionCode ?? 0);
            if (!Number.isInteger(currentCode) || currentCode < 0) {
              throw new Error('versionCode в version.json должен быть целым неотрицательным числом');
            }
          }

          const code = currentCode + 1;
          const versionName = (process.env.INPUT_VERSION_NAME ?? '').trim();
          const changelog = (process.env.INPUT_CHANGELOG ?? '').trim();
          if (!versionName || !changelog) {
            throw new Error('versionName и changelog не должны быть пустыми');
          }

          const info = {
            versionCode: code,
            versionName,
            releasedAt: new Date().toISOString(),
            changelog,
            apkUrl: 'messenger.apk',
          };
          fs.writeFileSync(versionPath, JSON.stringify(info, null, 2) + '\n');
          console.log(JSON.stringify(info, null, 2));
          NODE

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${version_path}"
            git commit -m "chore: bump Android version [skip ci]"

            if git push origin "HEAD:${branch}"; then
              version_code="$(node -p "require('./${version_path}').versionCode")"
              echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Ветка изменилась во время резервирования версии (попытка ${attempt}/5), повторяю..."
            sleep $((attempt * 5))
          done

          echo "::error::Не удалось зарезервировать versionCode после 5 попыток."
          exit 1

      # ── Node / pnpm ────────────────────────────────────────────────────────
      # Эти шаги идут после резервирования версии: reserve-step мог перейти на
      # более свежий origin/main, поэтому зависимости нужно читать и ставить
      # уже из окончательного commit, на котором собирается APK.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      # ── Java / Android SDK / NDK ───────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.1
        # react-native-webrtc and other native modules require NDK 27.1
        run: sdkmanager --install "ndk;27.1.12297006"

      # ── Expo prebuild ──────────────────────────────────────────────────────
      # Generates android/ native directory from Expo config plugins.
      # Runs entirely locally — no Expo account or EXPO_TOKEN required.
      # GOOGLE_SERVICES_JSON is written to google-services.json by app.config.js.
      - name: Run expo prebuild
        working-directory: artifacts/messenger-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean

      # ── Release signing ────────────────────────────────────────────────────
      # Decodes the keystore, then patches the generated build.gradle to add a
      # proper release signingConfig that reads from env vars at build time.
      # Secrets are never written to disk — they are passed only as env vars
      # to the Gradle process.
      - name: Configure release signing
        working-directory: artifacts/messenger-android
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_BASE64" | base64 --decode > keystore.jks

          python3 - << 'PYEOF'
          import sys

          path = 'android/app/build.gradle'
          txt = open(path).read()

          # 1. Insert release signingConfig block after the debug block.
          release_block = """\n        release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: "debug.keystore")
                      storePassword System.getenv("KS_PASS") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASS") ?: ""
                  }"""

          debug_end = "keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }"
          if debug_end in txt:
              txt = txt.replace(debug_end, debug_end + release_block, 1)
              print("Inserted release signingConfig block")
          else:
              print("WARNING: debug signingConfig end-marker not found — check build.gradle format", file=sys.stderr)

          # 2. Change the release buildType to use signingConfigs.release.
          marker = 'signingConfig signingConfigs.debug'
          last = txt.rfind(marker)
          if last != -1:
              txt = txt[:last] + txt[last:].replace(marker, 'signingConfig signingConfigs.release', 1)
              print("Wired release buildType to signingConfigs.release")
          else:
              print("WARNING: release signingConfig assignment not found", file=sys.stderr)

          # Note: firebase-messaging dependency is injected by the
          # withFirebaseCallService config plugin (withAppBuildGradle step).

          open(path, 'w').write(txt)
          print("build.gradle patched for release signing")
          PYEOF

      # ── Build APK ──────────────────────────────────────────────────────────
      - name: Build APK (Gradle)
        working-directory: artifacts/messenger-android/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/artifacts/messenger-android/keystore.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             "${{ github.workspace }}/messenger-family.apk"

      # ── Artifact ───────────────────────────────────────────────────────────
      # Скачай оба файла из артефакта и положи в /opt/messenger/updates/.
      # APK переименовать в messenger.apk (apkUrl в version.json = 'messenger.apk').
      - name: Upload APK + version.json
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android-v${{ inputs.version_name }}-${{ steps.generate-version.outputs.version_code }}
          path: |
            messenger-family.apk
            artifacts/messenger-android/version.json
          retention-days: 30
