# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK — local EAS build on GitHub Actions
#
# Required GitHub Secrets:
#   EXPO_TOKEN               — from https://expo.dev/accounts/<user>/settings/access-tokens
#   ANDROID_KEYSTORE_BASE64  — base64-encoded keystore file (see scripts/gen-keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# ─────────────────────────────────────────────────────────────────────────────

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Java / Android SDK / NDK ───────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.1
        # react-native-webrtc and other native modules require NDK 27.1
        run: sdkmanager --install "ndk;27.1.12297006"

      # ── EAS CLI ────────────────────────────────────────────────────────────
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Android keystore ───────────────────────────────────────────────────
      - name: Prepare keystore & credentials.json
        working-directory: artifacts/messenger-android
        env:
          KS_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:    ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:  ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 --decode > keystore.jks
          # credentials.json is read by EAS CLI when credentialsSource = "local"
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "keystore.jks",
                "keystorePassword": "$KS_PASS",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASS"
              }
            }
          }
          EOF

      # ── Firebase google-services.json ──────────────────────────────────────
      # Required for FCM push notifications. Store the full JSON content in the
      # GitHub secret GOOGLE_SERVICES_JSON. If the secret is absent the build
      # still succeeds but push notifications will not work in the resulting APK.
      - name: Write google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        working-directory: artifacts/messenger-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build APK (EAS local)
        working-directory: artifacts/messenger-android
        env:
          NODE_ENV: production
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/messenger-family.apk"

      # ── Artifact ───────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-android-v${{ github.run_number }}
          path: messenger-family.apk
          retention-days: 30
