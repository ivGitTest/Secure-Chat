kind = "mobile"
previewPath = "/messenger-android/"
title = "Семейный мессенджер"
version = "1.0.0"
id = "artifacts/messenger-android"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/messenger-android/" ]
localPort = 23684

[services.development]
run = "pnpm --filter @workspace/messenger-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/messenger-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/messenger-android", "run", "serve" ]

[services.env]
PORT = "23684"
BASE_PATH = "/messenger-android/"
