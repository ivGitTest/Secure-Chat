# ─── HTTP proxy (TLS is terminated by the host reverse proxy) ─────────────────
# This nginx runs inside Docker on 127.0.0.1:7080.
# The host proxy (nginx / Caddy) handles TLS for chat.naviry.xyz and forwards
# plain HTTP here. nginx then proxies WebSocket and REST to the api container.
server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS — браузер всегда использует HTTPS после первого визита.
    # Устанавливается здесь (а не в host-прокси), чтобы заголовок точно
    # прошёл через обе ступени прокси к клиенту.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Запрет MIME-sniffing
    add_header X-Content-Type-Options    "nosniff"                             always;
    # Запрет встраивания в iframe (clickjacking)
    add_header X-Frame-Options           "DENY"                                always;
    # Минимальная утечка Referer при переходе на другой сайт
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    # Отключить устаревший XSS-фильтр IE/Chrome (современные рекомендации — 0)
    add_header X-XSS-Protection          "0"                                   always;

    # ── WebSocket (must appear before /api/ to take priority) ─────────────────
    location /ws {
        proxy_pass         http://api:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Long timeouts — WebSocket connections are persistent
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── Docker healthcheck ────────────────────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
