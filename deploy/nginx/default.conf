# ─── HTTP proxy (TLS is terminated by the host reverse proxy) ─────────────────
# This nginx runs inside Docker on 127.0.0.1:7080.
# The host proxy (nginx / Caddy) handles TLS for chat.naviry.xyz and forwards
# plain HTTP here. nginx then proxies WebSocket and REST to the api container.
server {
    listen 80;
    server_name _;

    # ── WebSocket (must appear before /api/ to take priority) ─────────────────
    location /ws {
        proxy_pass         http://api:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Long timeouts — WebSocket connections are persistent
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── Docker healthcheck ────────────────────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
