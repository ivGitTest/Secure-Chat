services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       messenger
      POSTGRES_USER:     messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Bind mount to a host path so that `docker compose down -v` or
      # `docker volume prune` can never delete the data.
      # The directory is created automatically by Docker on first run.
      - ${POSTGRES_DATA_DIR:-/opt/messenger/postgres-data}:/var/lib/postgresql/data
    networks:
      - messenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API Server (REST + WebSocket + WebRTC signaling) ────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT:         "3000"
      NODE_ENV:     production
      DATABASE_URL: "postgresql://messenger:${POSTGRES_PASSWORD}@postgres:5432/messenger"
      JWT_SECRET:   ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      LOG_LEVEL:    ${LOG_LEVEL:-info}
      # TURN config forwarded to /api/v1/config for Android clients
      TURN_SECRET:  ${TURN_SECRET}
      TURN_REALM:   ${TURN_REALM}
      STUN_SERVERS: "stun:${DOMAIN}:3478"
      TURN_SERVERS: "turn:${DOMAIN}:3478"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/api/v1/health',r=>r.statusCode===200?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── coturn TURN / STUN server ───────────────────────────────────────────────
  # network_mode: host is required so coturn can relay UDP traffic on arbitrary
  # ephemeral ports without port-mapping all 16 k relay ports.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --external-ip=${EXTERNAL_IP}
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Nginx reverse proxy (TLS termination) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Bind to localhost only — TLS is terminated by the host reverse proxy
    ports:
      - "127.0.0.1:7080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - messenger
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  messenger:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
# No named volumes — postgres uses a bind mount (see POSTGRES_DATA_DIR in .env)
# so that `docker compose down -v` and `docker volume prune` cannot delete data.
