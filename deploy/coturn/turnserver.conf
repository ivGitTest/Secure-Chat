# ─────────────────────────────────────────────────────────────────────────────
# coturn TURN / STUN server — static configuration
#
# Secrets and realm are passed as CLI flags in docker-compose.yml so they can
# be sourced from the .env file without embedding them here.
# ─────────────────────────────────────────────────────────────────────────────

# Use HMAC-based time-limited credentials (compatible with WebRTC / coturn)
use-auth-secret

# UDP relay port range (keep narrow for a small deployment; ~100 concurrent streams)
min-port=49152
max-port=65535

# Logging — write to stdout so Docker captures logs via `docker compose logs`
log-file=stdout
verbose

# Disable CLI management interface (not needed for MVP)
no-cli

# Disable TCP relay (voice calls use UDP)
no-tcp-relay
